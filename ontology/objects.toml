# ── water ───────────────────────────────────────────────────────────────────────────────

[[class]]
id = "water"
name = "Water"
parent = "hydrography"
claimable = true
keyed_by = ["osm"]
osm = [{ natural = "water" }, { waterway = "river" }, { waterway = "canal" }]
synonyms = ["pond", "lake", "reservoir", "river", "canal"]
