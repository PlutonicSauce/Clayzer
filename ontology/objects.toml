# Object ontology for Captions: the one place object classes are defined.
#
# Every object a Claim can name is a class here. Code reads its lists from this file, and
# tests/test_ontology.py fails if the code's own lists drift from it (ADR-0008).
#
# Fields per class:
#   id, name          the Claim value and a readable name
#   parent            the class it is a kind of ("" for a root); gives partial credit in grounding
#   claimable         true if a Caption's Claims may use it today; false = candidate for later
#   definition        what the class covers in a Chip, in one line: what a Claim of it asserts
#   keyed_by          Answer Keys that can verify it (empty = Claims about it are unscored)
#   osm               OSM tag rules the code maps to this class (tested against answer_keys.osm_object);
#                     "*" is any value, and no rule matches a way tagged intermittent=yes
#   osm_reference     OSM tags for the class that the code does NOT use (e.g. power features come
#                     from USGS); documentation for Answer Keys outside the US
#   synonyms          other words people use; for retrieval queries and prompt wording
#   confusers         classes it is easily mistaken for in aerial imagery; for prompts and negatives
#   min_visible_m     rough smallest size identifiable in NAIP at 0.6 m (heuristic, not measured)
#   attributes        attribute names and allowed values Claims may carry
#   queries           retrieval queries whose right answers are Chips containing this class
#   rsicd_scenes      RSICD scene classes whose images imply this class is present (scene-level:
#                     usable for retrieval and fidelity, never as grounding)
#   land_cover        matching classes in NLCD (US) and ESA WorldCover, as each legend names them;
#                     checked 2026-11-04 against the MRLC NLCD legend and the WorldCover v2.0 user
#                     manual. `note` says where a legend's classes only partly match the class
#   caption_exemplars Layer C (ADR-0010): 1-2 short, class-LEVEL caption phrases in house style,
#                     fed to the captioner as few-shot examples. CIRCULARITY RULE: these are
#                     generic ("rows of dark solar panels…"), never a label for a scored Chip,
#                     and are written by hand or from a source we do NOT score against. They
#                     teach phrasing and help retrieval; they never state what is in THIS image.
#
# The data-driven Layer B (embedding prototypes per class, learned look-alikes, and co-occurrence
# statistics) is a generated sidecar, not this file: ontology/prototypes/<version>.json, built by
# `clayzer ontology build-prototypes` from a disjoint dev region (prototypes.py, ADR-0010). This
# file stays the small, hand-curated, diff-able symbolic layer.
#
# Version 0.1 (2026-11-03): matches the classes in harness.OBJECTS, grounding.KEYED,
# answer_keys.osm_object, and retrieval.QUERIES as they were on that date.
# Version 0.2 (2026-11-04): ontology-review — a definition per class; water is only water there
# all year (OSM mapped dry desert washes as intermittent streams); the road and building rules
# list everything the code maps; construction_site stays a candidate; well_pad added as one;
# land_cover `note` where a legend only partly matches. Plus Layer C caption_exemplars for the
# keyed classes (ADR-0010).

version = "0.2"

# ── roots ───────────────────────────────────────────────────────────────────────────────

[[class]]
id = "energy_infrastructure"
name = "Energy infrastructure"
parent = ""
claimable = false
definition = "Facilities that generate or carry electricity, or extract fuel."

[[class]]
id = "transportation"
name = "Transportation"
parent = ""
claimable = false
definition = "Ways and surfaces for moving or parking vehicles."

[[class]]
id = "built_structure"
name = "Built structure"
parent = ""
claimable = false
definition = "Roofed or man-made structures standing on the ground."

[[class]]
id = "hydrography"
name = "Water features"
parent = ""
claimable = false
definition = "Surface water features."

[[class]]
id = "land_cover"
name = "Land cover"
parent = ""
claimable = false
definition = "What covers open ground: crops, plants, or bare earth."

# ── energy ──────────────────────────────────────────────────────────────────────────────

[[class]]
id = "solar_array"
name = "Solar array"
parent = "energy_infrastructure"
claimable = true
definition = "Ground-mounted rows of photovoltaic panels; not racks without panels, and not rooftop panels."
keyed_by = ["uspvdb", "grw"]
osm_reference = [{ power = "plant", "plant:source" = "solar" }, { power = "generator", "generator:source" = "solar" }]
synonyms = ["solar farm", "solar park", "PV plant", "photovoltaic array", "solar panels"]
confusers = ["greenhouse", "parking_lot", "water", "construction_site"]
min_visible_m = 10
attributes = { size = ["small", "medium", "large"] }
queries = ["find solar farms"]
rsicd_scenes = []
caption_exemplars = ["Rows of dark blue-grey photovoltaic panels fill the centre of the tile.", "A large ground-mounted solar array in regular rectangular blocks, set in open land."]

[[class]]
id = "wind_turbine"
name = "Wind turbine"
parent = "energy_infrastructure"
claimable = true
definition = "A wind turbine tower with its rotor, one per tower."
keyed_by = ["uswtdb", "grw"]
osm_reference = [{ power = "generator", "generator:source" = "wind" }]
synonyms = ["wind farm", "wind generator", "turbine"]
confusers = ["transmission_tower"]
min_visible_m = 5
queries = ["find wind turbines"]
rsicd_scenes = []
caption_exemplars = ["Several white wind turbines, each casting a long thin shadow, stand spaced across open ground.", "Wind turbines set in a loose line through farmland."]

[[class]]
id = "substation"
name = "Electrical substation"
parent = "energy_infrastructure"
claimable = false
definition = "A fenced yard of electrical switchgear and transformers."
osm_reference = [{ power = "substation" }]
synonyms = ["switchyard"]
confusers = ["building", "parking_lot"]
min_visible_m = 20

[[class]]
id = "transmission_tower"
name = "Transmission tower"
parent = "energy_infrastructure"
claimable = false
definition = "A lattice or pole tower carrying high-voltage power lines."
osm_reference = [{ power = "tower" }]
synonyms = ["pylon", "power line tower"]
confusers = ["wind_turbine"]
min_visible_m = 5

# ── transportation ──────────────────────────────────────────────────────────────────────

[[class]]
id = "road"
name = "Road"
parent = "transportation"
claimable = true
definition = "A paved or unpaved road or track a vehicle can drive, including dirt tracks."
keyed_by = ["osm"]
osm = [
  { highway = "motorway" }, { highway = "trunk" }, { highway = "primary" }, { highway = "secondary" },
  { highway = "tertiary" }, { highway = "unclassified" }, { highway = "residential" },
  { highway = "service" }, { highway = "track" }, { highway = "motorway_link" },
  { highway = "trunk_link" }, { highway = "primary_link" }, { highway = "secondary_link" },
]
synonyms = ["street", "highway", "track", "dirt road"]
confusers = ["railroad"]
min_visible_m = 3
attributes = { surface = ["paved", "unpaved"] }
queries = []
rsicd_scenes = ["viaduct", "bridge"]
caption_exemplars = ["A paved road runs across the tile from edge to edge.", "A straight road separates two fields."]

[[class]]
id = "railroad"
name = "Railroad"
parent = "transportation"
claimable = true
definition = "Railway track."
keyed_by = ["osm"]
osm = [{ railway = "rail" }]
synonyms = ["railway", "rail line", "train tracks"]
confusers = ["road"]
min_visible_m = 3
queries = ["find railroads"]
rsicd_scenes = ["railwaystation"]
caption_exemplars = ["A single rail line crosses the tile in a long gentle curve.", "Parallel train tracks run beside open ground."]

[[class]]
id = "parking_lot"
name = "Parking lot"
parent = "transportation"
claimable = true
definition = "A paved or gravel area marked or used for parking vehicles."
keyed_by = ["osm"]
osm = [{ amenity = "parking" }]
synonyms = ["car park", "parking area"]
confusers = ["solar_array", "bare_ground"]
min_visible_m = 10
queries = ["find parking lots"]
rsicd_scenes = ["parking"]
caption_exemplars = ["A paved parking lot with marked rows of spaces, some holding cars.", "An open paved lot beside a building, lined with parking bays."]

[[class]]
id = "runway"
name = "Runway"
parent = "transportation"
claimable = false
definition = "An airport runway or airstrip."
osm_reference = [{ aeroway = "runway" }]
synonyms = ["airstrip"]
confusers = ["road"]
min_visible_m = 20
rsicd_scenes = ["airport"]

# ── built structures ────────────────────────────────────────────────────────────────────

[[class]]
id = "building"
name = "Building"
parent = "built_structure"
claimable = true
definition = "A roofed structure: house, barn, shed, warehouse, or other building."
keyed_by = ["osm"]
osm = [{ building = "*" }]  # any building value; greenhouse is matched first
synonyms = ["house", "warehouse", "structure", "barn"]
confusers = ["greenhouse", "substation"]
min_visible_m = 4
queries = ["find buildings"]
rsicd_scenes = ["denseresidential", "mediumresidential", "sparseresidential", "commercial", "industrial", "school", "church", "center"]
caption_exemplars = ["A cluster of rectangular building roofs with a road alongside.", "A large industrial building with a flat rectangular roof."]

[[class]]
id = "greenhouse"
name = "Greenhouse"
parent = "building"
claimable = true
definition = "A glass or plastic-covered structure for growing plants."
keyed_by = ["osm"]
osm = [{ building = "greenhouse" }, { landuse = "greenhouse_horticulture" }]
synonyms = ["glasshouse", "hothouse", "polytunnel"]
confusers = ["solar_array", "building"]
min_visible_m = 5
queries = ["find greenhouses"]
rsicd_scenes = []
caption_exemplars = ["Long pale greenhouse roofs in parallel rows, brighter and more reflective than solar panels.", "A block of glasshouses with light, translucent roofs."]

[[class]]
id = "storage_tank"
name = "Storage tank"
parent = "built_structure"
claimable = false
definition = "A cylindrical tank for liquids or gas, seen from above as a circle."
osm_reference = [{ man_made = "storage_tank" }]
synonyms = ["oil tank", "silo"]
confusers = ["building"]
min_visible_m = 5
rsicd_scenes = ["storagetanks"]

# ── water ───────────────────────────────────────────────────────────────────────────────

[[class]]
id = "water"
name = "Water"
parent = "hydrography"
claimable = true
definition = "Standing or flowing water visible in the Chip: pond, lake, reservoir, river, or canal; not a dry wash or a dry basin."
keyed_by = ["osm"]
osm = [{ natural = "water" }, { waterway = "river" }, { waterway = "canal" }]
synonyms = ["pond", "lake", "reservoir", "river", "canal"]
confusers = ["solar_array"]
min_visible_m = 5
queries = ["find water"]
rsicd_scenes = ["pond", "river", "beach", "port"]
land_cover = { nlcd = ["11 Open Water"], worldcover = ["Permanent water bodies"] }
caption_exemplars = ["A dark, smooth body of water occupies part of the tile.", "A pond with an irregular shoreline set among open land."]

# ── land cover ──────────────────────────────────────────────────────────────────────────

[[class]]
id = "field"
name = "Farm field"
parent = "land_cover"
claimable = true
definition = "Cultivated or irrigated cropland, or managed pasture, with field edges; not open desert, scrub, or grassland."
keyed_by = ["osm"]
osm = [{ landuse = "farmland" }, { landuse = "meadow" }, { landuse = "orchard" }, { landuse = "vineyard" }]
synonyms = ["farmland", "cropland", "agricultural field", "pasture"]
confusers = ["vegetation", "bare_ground"]
min_visible_m = 20
queries = ["find farmland"]
rsicd_scenes = ["farmland", "meadow"]
land_cover = { nlcd = ["81 Pasture/Hay", "82 Cultivated Crops"], worldcover = ["Cropland"], note = "WorldCover's Cropland is annual crops only: it maps orchards as Tree cover, vineyards as Shrubland, and pastures as Grassland, so WorldCover misses part of this class. NLCD's Cultivated Crops includes orchards and vineyards." }
caption_exemplars = ["Cultivated farm fields in large rectangular parcels of differing colours.", "An agricultural field with visible plough lines."]

[[class]]
id = "vegetation"
name = "Vegetation"
parent = "land_cover"
claimable = true
definition = "Trees, shrubs, scrub, or grass that isn't a farm field."
keyed_by = []
synonyms = ["trees", "shrubs", "scrub", "woodland"]
confusers = ["field"]
min_visible_m = 5
rsicd_scenes = ["forest", "park"]
land_cover = { nlcd = ["41 Deciduous Forest", "42 Evergreen Forest", "43 Mixed Forest", "51 Dwarf Scrub", "52 Shrub/Scrub", "71 Grassland/Herbaceous", "72 Sedge/Herbaceous", "73 Lichens", "74 Moss", "90 Woody Wetlands", "95 Emergent Herbaceous Wetlands"], worldcover = ["Tree cover", "Shrubland", "Grassland", "Herbaceous wetland", "Mangroves", "Moss and lichen"], note = "NLCD 51 and 72 to 74 are Alaska only. WorldCover's Grassland includes pastures, and its Tree cover includes orchards and plantations, which are field here. Most Mojave desert is NLCD 52 Shrub/Scrub, not 31 Barren Land, so NLCD calls much of what Captions call bare desert vegetation." }

[[class]]
id = "bare_ground"
name = "Bare ground"
parent = "land_cover"
claimable = true
definition = "Open ground with little or no vegetation: desert, dry lake bed, bare soil, or sand."
keyed_by = []
synonyms = ["bare soil", "desert", "dirt", "sand", "dry lake bed", "playa"]
confusers = ["parking_lot", "field"]
min_visible_m = 20
rsicd_scenes = ["bareland", "desert"]
land_cover = { nlcd = ["31 Barren Land (Rock/Sand/Clay)"], worldcover = ["Bare / sparse vegetation"], note = "NLCD's Barren Land has under 15% vegetation; WorldCover's Bare / sparse vegetation never has more than 10% at any time of year. Desert scrub above those is vegetation in both." }

# Candidate, kept as one by ontology-review (2026-11-04). For: Captions call fixed-dev-neg-1 a
# construction site in 13 of its 19 stored Captions, and Chips show it (a graded site, racks
# not yet panelled, a turbine foundation being repowered). Against: in dev63-base only 6 of 189
# Captions mention it, on 3 Cases, and its only Answer Key, OSM landuse=construction, goes out of
# date fastest of any tag (and the Harness must never read it, ADR-0006). It is a look-alike of
# solar_array, for racks without panels. Revisit if Clay's captions need it.
[[class]]
id = "construction_site"
name = "Construction site"
parent = "land_cover"
claimable = false
definition = "Ground being graded, excavated, or built on, with equipment or unfinished structures."
osm_reference = [{ landuse = "construction" }]
synonyms = ["building site", "excavation", "earthworks", "foundation"]
confusers = ["bare_ground", "parking_lot", "storage_tank"]
min_visible_m = 30

# Candidate added by ontology-review (2026-11-04): oil and gas well pads, cleared caliche pads
# with a pumpjack or tanks, on 2 of the 7 Texas rangeland negatives. No Answer Key scores it.
[[class]]
id = "well_pad"
name = "Well pad"
parent = "energy_infrastructure"
claimable = false
definition = "A cleared pad around an oil or gas well, often with a pumpjack, tanks, or a lease road."
osm_reference = [{ man_made = "petroleum_well" }]
synonyms = ["oil well", "gas well", "pumpjack", "drill pad", "lease pad"]
confusers = ["construction_site", "bare_ground", "parking_lot"]
min_visible_m = 30
