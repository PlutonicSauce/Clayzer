# Object ontology for Captions: the one place object classes are defined.
#
# Every object a Claim can name is a class here. Code reads its lists from this file, and
# tests/test_ontology.py fails if the code's own lists drift from it (ADR-0008).
#
# Fields per class:
#   id, name          the Claim value and a readable name
#   parent            the class it is a kind of ("" for a root); gives partial credit in grounding
#   claimable         true if a Caption's Claims may use it today; false = candidate for later
#   keyed_by          Answer Keys that can verify it (empty = Claims about it are unscored)
#   osm               OSM tag rules the code maps to this class (tested against answer_keys.osm_object)
#   osm_reference     OSM tags for the class that the code does NOT use (e.g. power features come
#                     from USGS); documentation for Answer Keys outside the US
#   synonyms          other words people use; for retrieval queries and prompt wording
#   confusers         classes it is easily mistaken for in aerial imagery; for prompts and negatives
#   min_visible_m     rough smallest size identifiable in NAIP at 0.6 m (heuristic, not measured)
#   attributes        attribute names and allowed values Claims may carry
#   queries           retrieval queries whose right answers are Chips containing this class
#   rsicd_scenes      RSICD scene classes whose images imply this class is present (scene-level:
#                     usable for retrieval and fidelity, never as grounding)
#   land_cover        matching classes in NLCD (US) and ESA WorldCover; from general knowledge,
#                     check against the published legends before relying on them
#
# Version 0.1 (2026-11-03): matches the classes in harness.OBJECTS, grounding.KEYED,
# answer_keys.osm_object, and retrieval.QUERIES as they were on that date.

version = "0.1"

# ── roots ───────────────────────────────────────────────────────────────────────────────

[[class]]
id = "energy_infrastructure"
name = "Energy infrastructure"
parent = ""
claimable = false

[[class]]
id = "transportation"
name = "Transportation"
parent = ""
claimable = false

[[class]]
id = "built_structure"
name = "Built structure"
parent = ""
claimable = false

[[class]]
id = "hydrography"
name = "Water features"
parent = ""
claimable = false

[[class]]
id = "land_cover"
name = "Land cover"
parent = ""
claimable = false

# ── energy ──────────────────────────────────────────────────────────────────────────────

[[class]]
id = "solar_array"
name = "Solar array"
parent = "energy_infrastructure"
claimable = true
keyed_by = ["uspvdb", "grw"]
osm_reference = [{ power = "plant", "plant:source" = "solar" }, { power = "generator", "generator:source" = "solar" }]
synonyms = ["solar farm", "solar park", "PV plant", "photovoltaic array", "solar panels"]
confusers = ["greenhouse", "parking_lot", "water"]
min_visible_m = 10
attributes = { size = ["small", "medium", "large"] }
queries = ["find solar farms"]
rsicd_scenes = []

[[class]]
id = "wind_turbine"
name = "Wind turbine"
parent = "energy_infrastructure"
claimable = true
keyed_by = ["uswtdb", "grw"]
osm_reference = [{ power = "generator", "generator:source" = "wind" }]
synonyms = ["wind farm", "wind generator", "turbine"]
confusers = ["transmission_tower"]
min_visible_m = 5
queries = ["find wind turbines"]
rsicd_scenes = []

[[class]]
id = "substation"
name = "Electrical substation"
parent = "energy_infrastructure"
claimable = false
osm_reference = [{ power = "substation" }]
synonyms = ["switchyard"]
confusers = ["building", "parking_lot"]
min_visible_m = 20

[[class]]
id = "transmission_tower"
name = "Transmission tower"
parent = "energy_infrastructure"
claimable = false
osm_reference = [{ power = "tower" }]
synonyms = ["pylon", "power line tower"]
confusers = ["wind_turbine"]
min_visible_m = 5

