confusers = ["greenhouse", "substation"]
min_visible_m = 4
queries = ["find buildings"]
rsicd_scenes = ["denseresidential", "mediumresidential", "sparseresidential", "commercial", "industrial", "school", "church", "center"]

[[class]]
id = "greenhouse"
name = "Greenhouse"
parent = "building"
claimable = true
keyed_by = ["osm"]
osm = [{ building = "greenhouse" }, { landuse = "greenhouse_horticulture" }]
