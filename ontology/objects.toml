[[class]]
id = "railroad"
name = "Railroad"
parent = "transportation"
claimable = true
keyed_by = ["osm"]
osm = [{ railway = "rail" }]
synonyms = ["railway", "rail line", "train tracks"]
confusers = ["road"]
min_visible_m = 3
queries = ["find railroads"]
