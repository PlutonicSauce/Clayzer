# The team's work board, shown on the Tasks page of `clayzer ui`.
#
# One [[task]] per piece of work. Keep it in step with docs/caption-plan.md: the plan says what
# and why; this file says who is doing what now. Edit it in a PR like any other doc.
#
#   area    one of the five functional areas (caption-plan.md §4)
#   tier    Must, Should, or Could (caption-plan.md §2)
#   status  done, doing, todo, blocked, or decide (waiting on a team decision)
#   closes  requirement ids: CAP-* (caption-design.md §2.1), REQ-* (caption-design.md §2.3),
#           AWS-* (caption-design.md §2.2)
#   start   where to begin: a file, a command, or a plan section
#   after   ids of tasks that should land first
#   context what the task is, why it matters, what exists today, the approach
#   done_when  checkable acceptance points
#   refs    files and sections to read first
#   step    the How it works step the task belongs to: case, harness, capture, summarize,
#           workflow, output, report, batch, gate, or ship

# ── Data and Cases ──────────────────────────────────────────────────────────────────────

[[task]]
id = "data-access"
step = "case"
title = "Verify data access: USGS, NAIP (Planetary Computer and AWS), OSM, Bedrock"
area = "Data and Cases"
tier = "Must"
status = "done"
closes = ["CAP-03", "CAP-19", "AWS-03"]
start = "caption-plan.md §3"
notes = "Verified 2026-11-03 in one participant account."
context = "Every source the pipeline reads was checked on 2026-11-03 from a laptop and from one participant account: the USGS PostgREST APIs, NAIP on Planetary Computer and on AWS (Requester-Pays, us-west-2), Overpass for OSM, and Bedrock (Nova Pro, Opus 5.5, Titan Text Embeddings v2). Each teammate has their own account, so each repeats the check there."
done_when = [
  "`uv run clayzer case uspvdb 400117` succeeds in your account with `CLAYZER_NAIP_SOURCE=aws`",
  "A one-Case Batch (`clayzer batch --repeats 1 --only <case-id>`) runs Nova Pro, Opus 5.5, and Titan",
]
refs = [
  "docs/caption-plan.md §3 (Data)",
  "README.md (Set up, Storage)",
  "docs/sources.toml",
]

[[task]]
id = "dev-cases"
step = "case"
title = "Build the ~60 development Cases (40 positive, 20 negative) in Mojave/Tehachapi"
area = "Data and Cases"
tier = "Must"
status = "doing"
closes = ["CAP-01", "CAP-16"]
start = "uv run clayzer case uspvdb <id>  ·  src/clayzer/cases.py"
notes = "4 built. Mix sizes and surroundings; include ordinary land (caption-plan.md §3)."
context = "The regression gate is only as good as the Case set: with 4 Cases it can't see drops smaller than about 0.1 to 0.2. Build about 60 development Cases in Mojave/Tehachapi: about 40 positives (solar arrays and wind turbines of mixed sizes and surroundings) and about 20 negatives (farmland, towns, desert, look-alikes). Positives start from a USGS record; `clayzer case` offsets the Chip automatically so the site can land in any grid cell, and uses a NAIP image taken after the site was built."
done_when = [
  "About 40 positive and 20 negative Cases in `cases/caption-dev.jsonl`",
  "A spread of small, medium, and large solar arrays, and single and grouped turbines",
  "Every Case's Reference Labels checked by eye on the web app's Cases page",
  "A new Baseline accepted on the full set (`clayzer baseline accept`)",
]
refs = [
  "docs/caption-plan.md §3 (two-step selection rules)",
  "docs/caption-plan.md §5.1 (Case format)",
  "src/clayzer/cases.py",
  "src/clayzer/answer_keys.py",
  "README.md (Build Cases)",
]

[[task]]
id = "lookalike-negatives"
step = "case"
title = "Find look-alike negatives (greenhouses, parking lots) with LGND Geo's NAIP search"
area = "Data and Cases"
tier = "Must"
status = "todo"
closes = ["CAP-18"]
start = "LGND Geo search_place_find; then uv run clayzer case neg <lon> <lat>"
after = ["dev-cases"]
context = "Negatives that look like positives test whether the captioner can tell a greenhouse or a parking lot from a solar array. LGND Geo's `search_place_find` takes a text description (\"greenhouse\", \"solar farm\") or an example, inside a bounding box, over NAIP. Keep results USGS doesn't list; `clayzer case neg` refuses a point with a USGS record within about 300 m. The ontology lists each class's look-alikes (`confusers`)."
done_when = [
  "At least 8 look-alike negatives (greenhouses, parking lots, reflective roofs)",
  "Each built with `clayzer case neg <lon> <lat> --n <k>` and checked by eye",
  "The LGND searches used are noted in the PR",
]
refs = [
  "docs/caption-plan.md §3 (LGND Geo row, two-step selection)",
  "ontology/objects.toml",
  "src/clayzer/cases.py (build_negative)",
]

