area = "Demo and delivery"
tier = "Should"
status = "todo"
start = "CONTRIBUTING.md (new)"
context = "Teammates from several organizations work in one public repo, each in their own AWS account. Write down what's only in people's heads today. Set up: uv, the `ui` and `tools` extras, AWS keys in a gitignored .env, `clayzer login lgnd`. Pick a task: the Tasks page and docs/tasks.toml (put your name in `owner`; follow `after`). Branch and PR: one task per branch, worktrees for parallel work, the PR updates the task's status, and done tasks get `see_it` and `changes`. Check before a PR: lint, format, tests (the same as CI). Public-repo rules: no .env, data/, batches/, benchmark images, private hostnames, package indexes, or account ids; use GLOSSARY.md terms; record decisions as ADRs."
