status = "done"
closes = ["REQ-14"]
notes = "Done 2026-11-04: src/clayzer/provenance.py. A Batch now also saves the Judge's rubric (judge-prompt.txt, hashed), a SHA-256 of every Chip (chips.json, checked before each Run), the ontology's version and file hash, the git commit and whether it had uncommitted changes, and the narrative model. A replaced Chip is a Sandbox Failure, and resume refuses a changed rubric. Compare and the gate treat rubric, Chip and ontology changes as measurement changes; Batches from before show them as not recorded, and the gate says to re-run the Baseline. Benchmark Reference Captions (RSICD) aren't used yet, so their dataset version isn't recorded yet."
see_it = "A Batch's page (#/batches/<id>/provenance): every setting beside the Baseline's, with differences marked, and every stored file with an in-app link, its store address to copy, and an AWS console link on S3. A Run's page: Provenance, with the Case and Chip it was scored on and its Trace, summary and narrative."
