context = "A Gateway would be one place that decides which MCP servers the Harness can reach, which is where the ADR-0006 allowlist (tool-allowlist) could be enforced outside our code. The price: a Gateway only runs a browser sign-in for callers with a JWT, so it needs a Cognito user pool, an app client, and a user; stdio servers like RODA would also need hosting as remote servers. The in-code allowlist (tool-allowlist) covers the requirement without any of that. Decide whether the extra enforcement point is worth it for the demo."
