title = "GitHub Actions CI: lint, format, tests, and the deck smoke test on every push and PR"
area = "Platform"
tier = "Should"
status = "todo"
start = ".github/workflows/ci.yml (new)"
context = "Six people push to one public repo, and today nothing checks a PR before it merges. A GitHub Actions workflow runs on every push and pull request: `uv run ruff check src tests`, `uv run ruff format --check src tests`, `uv run pytest` with the `ui` and `tools` extras, and `node tests/deck_smoke.mjs`. The tests already run offline (fake Bedrock, local MCP servers), so CI needs no AWS credentials and gets none. uv.lock is gitignored because a local one records a private package index, so CI resolves from public PyPI; decide whether to commit a lock generated against public PyPI so CI and laptops install the same versions. Once the readiness check exists, run its leak scan here too."
done_when = [
  "The workflow runs on push and pull_request and passes on the main branch",
  "A PR that breaks a test or lint fails its check",
  "No secrets or AWS credentials in the workflow",
  "The README shows the CI status badge",
]
refs = [
  "pyproject.toml",
  "tests/deck_smoke.mjs",
  "README.md",
  ".gitignore",
]

