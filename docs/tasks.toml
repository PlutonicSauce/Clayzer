notes = "Written and tested, not yet deployed (2026-11-04). infra/agentcore_app.py is its own CDK app, so the web app's `cdk deploy` is unchanged and infra/app.py (the `cdk` task) is untouched. It creates the Runtime, its image, a least-privilege role, and the workload identity; the 8 template tests pass, and the real `cdk synth` produces the expected resources. Found: CloudFormation does have AWS::BedrockAgentCore::OAuth2CredentialProvider, but the OAuth client behind it needs the provider's own callback address at registration, so it stays a step of `clayzer agentcore login`. Order matters: deploy first, then `login`, or `login` creates the workload identity and the deploy then collides with it. Waiting on: the account being bootstrapped for CDK (it is not; bootstrapping creates an S3 bucket, an ECR repo and IAM roles), then one real `cdk deploy`, a Batch on that Runtime, and `cdk destroy`; a teammate then repeats it in their own account."
context = "Turn the scripted experiment into CDK so a teammate deploys it into their own account and `cdk destroy` removes it. CloudFormation has AWS::BedrockAgentCore::Runtime, Gateway, and GatewayTarget, and aws-cdk-lib has an aws_bedrockagentcore module. Two things CDK can't do: the browser approval of the LGND sign-in (one per account, after deploy), and possibly the OAuth client registration at LGND's sign-in server (check whether CloudFormation has a resource for the Identity OAuth client; if not, a small script step stays). Coordinate with the `cdk` task, which is in progress in infra/app.py."
