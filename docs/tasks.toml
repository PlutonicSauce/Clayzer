[[task]]
id = "replay"
step = "report"
title = "Recorded-Trace replay: rescore stored Captions without calling the Harness"
area = "Platform"
tier = "Must"
status = "done"
closes = ["REQ-09"]
start = "batches/<id>/captions.jsonl"
notes = "Done 2026-11-04: `clayzer rescore` already rebuilt everything from the store; tests/test_replay.py now proves it. It runs a Batch, breaks its stored grounding, deletes its reports, then cuts the network (sockets refuse), AWS credentials, and the Bedrock client, and runs `clayzer rescore` through the CLI: grounding is recomputed, every Judge verdict and the retrieval results come back unchanged (none requested again), and the Batch report and every Run report are rewritten. No code change was needed for the replay itself. Then `clayzer replay` (2026-11-04) rescores a recorded Batch against updated Cases into a new Batch, with no model calls: rescore grades against the Batch's frozen Cases, so a label fix would make the Baseline incomparable. Replay reuses the Captions, Judge verdicts and Traces, re-grounds every Run with the new labels, re-ranks retrieval from the stored ranked lists, and records replayed_from and the new cases_sha. It refuses when the Case ids or Chips differ, or when a newly relevant query was never ranked. Used for the dev Baseline: 20261104T193330Z-dev74-base replayed as 20261104T211847Z-dev74-base after main corrected one turbine count; only that Case's count score moved. Replay copies its S3 objects one at a time (about 12 minutes for 222 Runs). The gate now counts a Run whose Caption made no gradable Claims as a complete correctness sample (correctness is undefined there, not missing), so such a Batch can be accepted. Step 7 2026-11-04: clayzer replay reads only explicit local files and writes a new disjoint output directory. Recomputes deterministic grounding/workflow and summaries, retains recorded Fidelity/retrieval, preserves failure statuses, warns on missing evidence/evaluator changes, and hashes inputs. Tests block sockets, Bedrock, boto3, embeddings and MCP; verify original hashes and deterministic repeated exports."
context = "The brief's fallback: a recorded Trace can be scored and reported with no model, MCP server, credentials, or network, with Judge verdicts replayed from saved results. `clayzer rescore` already re-scores stored Captions; extend it so reports rebuild fully offline, and prove it with the network off."
done_when = [
  "A Batch rescored and reported with the network disabled",
  "Judge verdicts reused, not requested again",
  "A test that runs with no AWS credentials",
]
refs = [
  "docs/caption-design.md §2.3 (REQ-09)",
  "src/clayzer/batch.py (rescore)",
]
see_it = "CLI: `uv run clayzer rescore <batch-id>` with the network off (a local store, CLAYZER_STORE unset); `uv run clayzer replay <batch-id> --cases <key>` for updated Cases, writing a new Batch with replayed_from in its batch.json. The tests: `uv run pytest tests/test_replay.py tests/test_replay_updated_cases.py`. uv run python scripts/report_demo.py --output /tmp/clayzer-report-demo-new; see docs/report-handoff.md"
changes = ["tests/test_replay_stored_batch.py: a Batch rescored and reported through the CLI with no network, AWS credentials, or Bedrock client; Judge verdicts and retrieval reused", "src/clayzer/batch.py: rescore's docstring says Judge verdicts are reused, never requested again", "src/clayzer/batch.py: replay and _rerank rescore a recorded Batch against updated Cases offline", "src/clayzer/cli.py: clayzer replay subcommand", "src/clayzer/gate_evidence.py: a Run with nothing to grade is a complete correctness sample", "tests/test_replay_updated_cases.py: replay against updated Cases offline, a replayed Baseline gating a live Batch, and the refusals", "src/clayzer/batch.py: _regrade is the per-Run regrading shared by rescore and replay", "src/clayzer/replay.py: non-destructive offline replay into an isolated LocalStore", "src/clayzer/cli.py: replay command and ui --local-root for an offline read-only demo", "tests/test_replay.py: network prohibition, identities, missing/invalid inputs, historical and updated 63-Case formats"]

