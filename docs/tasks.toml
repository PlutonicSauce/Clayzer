[[task]]
id = "verify-then-write"
step = "harness"
title = "Verify-then-write: check each Claim with LGND's imagery check at its grid cell"
area = "Captioning"
tier = "Must"
status = "done"
closes = ["CAP-10", "REQ-01", "CAP-18"]
start = "caption-plan.md §1.3, §6"
after = ["lgnd-client", "grounding-fix"]
notes = "Done 2026-11-04: `clayzer batch --verify`. Gated against the Baseline (4 dev Cases \u00d7 3 Repeats, Batch 20261104T124711Z-verify-2): FAIL. Correctness rose on all 4 Cases (two flagged improved: the negative Case 0.59 \u2192 0.81, uspvdb-402150 0.52 \u2192 0.66); 49 of 60 Claims confirmed, 10 moved, 1 unverified. On the negative Case it removed two false solar arrays (a storage yard, dirt ground) and a false vegetation Claim, but also parking lots placed one cell off, which cost coverage there (0.47 \u2192 0.33). Retrieval MRR fell in 2 of 3 Repeats (Batch 0.89 \u2192 0.78; candidate Spread \u00b10.10), with rewritten Captions shorter (39 \u2192 36 words). So `--verify` stays opt-in. Next: re-check a rejected Claim in the neighbouring cells and move it instead of dropping it, and keep the rewrite's wording close to the draft. LGND's 5-minute tokens are refreshed mid-Batch (verified)."
context = "The Harness drafts Claims, checks each with LGND Geo's `reasoning_imagery_check` at its grid cell, and writes the Caption only from confirmed Claims; the rest go in `uncertain`. To check a cell, look up the LGND image at the cell's centre with `search_chip_lat_lon` (LGND images are about 160 m across, roughly one cell). The verifier is never an Answer Key and never used in scoring."
done_when = [
  "Each check is a `tool` Step in the Trace",
  "Unconfirmed Claims move to `uncertain`",
  "A Batch with verification gated against the Baseline, with the result in the PR",
]
refs = [
  "docs/caption-plan.md §1.3",
  "docs/caption-plan.md §6",
  "docs/adr/0006-answer-keys-are-hidden-from-caption-inputs.md",
]
see_it = "CLI: `clayzer batch --verify` (after `clayzer login lgnd`). A Run's page (#/runs/<batch>/<case>/<repeat>) shows each lookup and check as a tool Step, then the rewrite; `clayzer gate <batch>` compares it with the Baseline."
changes = [
  "src/clayzer/verify.py: the image lookup at each Claim's cell centre, the imagery check, and the keep / move / unverified policy",
  "src/clayzer/harness.py: caption() verifies after drafting, and a text-only rewrite writes the prose from the confirmed Claims",
  "src/clayzer/batch.py: BatchConfig.verify; the model is offered only its own tools, the verifier gets LGND and the Chip's footprint",
  "src/clayzer/tools.py: Toolbox.view, some servers' tools sharing one set of connections",
  "src/clayzer/mcp_auth.py: stored_token_auth refreshes the saved sign-in before it expires and once on a 401, within a running Batch",
  "docs/adr/0009-the-verifier-gets-the-chip-footprint-the-captioner-doesnt.md: why the code, not the model, verifies",
  "tests/test_verify.py: the policy, the rewrite, the Workflow Score's tool plan, and a Batch with a fake LGND",
]

