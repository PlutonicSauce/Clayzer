# The team's work board, shown on the Tasks page of `clayzer ui`.
#
# One [[task]] per piece of work. Keep it in step with docs/caption-plan.md: the plan says what
# and why; this file says who is doing what now. Edit it in a PR like any other doc.
#
#   area    one of the five functional areas (caption-plan.md §4)
#   tier    Must, Should, or Could (caption-plan.md §2)
#   status  done, doing, todo, blocked, or decide (waiting on a team decision)
#   closes  requirement ids: CAP-* (caption-design.md §2.1), REQ-* (caption-design.md §2.3),
#           AWS-* (caption-design.md §2.2)
#   start   where to begin: a file, a command, or a plan section
#   after   ids of tasks that should land first

# ── Data and Cases ──────────────────────────────────────────────────────────────────────

[[task]]
id = "data-access"
title = "Verify data access: USGS, NAIP (Planetary Computer and AWS), OSM, Bedrock"
area = "Data and Cases"
tier = "Must"
status = "done"
closes = ["CAP-03", "CAP-19", "AWS-03"]
start = "caption-plan.md §3"
notes = "Verified 2026-11-03 in one participant account."

[[task]]
id = "dev-cases"
title = "Build the ~60 development Cases (40 positive, 20 negative) in Mojave/Tehachapi"
area = "Data and Cases"
tier = "Must"
status = "doing"
closes = ["CAP-01", "CAP-16"]
start = "uv run clayzer case uspvdb <id>  ·  src/clayzer/cases.py"
notes = "4 built. Mix sizes and surroundings; include ordinary land (caption-plan.md §3)."

