[[task]]
id = "case-spread"
step = "case"
title = "Measure how varied the Cases' surroundings are, and fill the gaps"
area = "Data and Cases"
tier = "Should"
status = "doing"
closes = ["CAP-01", "CAP-18"]
start = "uv run clayzer spread --suggest"
after = ["dev-cases"]
notes = "First measure 2026-11-04 (63 dev Cases, 50 LGND calls): wind 11 of 13 in desert scrub (evenness 0.28), no farmland, grassland or town turbines; solar 8 desert scrub, 11 farmland, 7 industrial, 4 grassland, and no woodland or town; negatives evenest (0.70), half desert scrub. LGND's solar misses were 39% rooftop or car-park arrays and 39% woodland ground-mounts, exactly the settings the solar Cases lack."
context = "LGND found accurate but narrow seeds (wind turbines nearly all on dry rangeland) cap what a model can learn. A Case set has the same risk for the gate: a captioner change that breaks woodland or rooftop arrays scores as no change if no Case shows one. `clayzer spread` labels one subject-free cell of each Chip with an LGND settings classifier (desert scrub, farmland, grassland, woodland, town, industrial, mountains; text examples in src/clayzer/spread.py), counts each group's settings, and with --suggest searches LGND for each gap and prints `clayzer case` commands for the nearest USGS sites at least 1 km from every Case."
done_when = [
  "Solar Cases in woodland and town (rooftop or car-park arrays), and wind Cases in grassland or farmland, each checked by eye",
  "`clayzer spread` evenness for wind above 0.5",
  "A new Baseline accepted on the larger set",
]
refs = [
  "src/clayzer/spread.py",
  "docs/cli.md (Build Cases: setting spread)",
]

