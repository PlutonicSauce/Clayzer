notes = "Built 2026-11-04; an unchanged rerun passed and a vague prompt failed."

[[task]]
id = "grounding-fix"
title = "Stop grounding from rewarding Captions that say less"
area = "Evaluation"
tier = "Must"
status = "done"
closes = ["CAP-10"]
start = "src/clayzer/grounding.py; caption-plan.md §8"
notes = "Done 2026-11-04: Chips offset so the site can be in any cell; grounding split into correctness and coverage. Follow-up: centre's neighbour credit (next task)."

[[task]]
id = "gate-rule"
title = "Stop a noisy candidate from relaxing its own regression gate"
area = "Evaluation"
tier = "Must"
status = "done"
closes = ["CAP-15"]
start = "src/clayzer/gate.py; caption-plan.md §8"
notes = "Done 2026-11-04: the Baseline's Spread only, plus a warning when a Case turns erratic."

[[task]]
id = "centre-credit"
title = "Stop \"centre\" earning half credit for position on every Case"
area = "Evaluation"
tier = "Must"
status = "decide"
closes = ["CAP-10"]
start = "src/clayzer/grounding.py _position_score; caption-plan.md §8"
notes = "The centre cell neighbours all 8 others, so a Claim at centre always scores at least 0.5. Options: no neighbour credit, or only along a row or column."

