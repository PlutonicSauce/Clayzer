notes = "Done 2026-11-04 on branch feat/agentcore-harness, and run live in one participant account (us-west-2): real dev Cases, Nova Pro captioner, Opus 5.5 Judge, LGND verification inside the Runtime on the sign-in held by Identity. The built pieces are the tasks agentcore-identity-token and agentcore-runtime-harness; agentcore-cdk (deploying it by CDK into a teammate's account) is still to be run, since it needs the account bootstrapped. Parity with the local Harness: 3 Repeats can't tell them apart (the local Harness fails the gate against itself on 2 of 3 Cases); with 10 Repeats of 3 Cases (30 Runs per side) correctness was 0.75 on AgentCore vs 0.78 and 0.83 on two local runs, p=0.19, and coverage identical at 0.48; one Case (neg-1) read lower on AgentCore (0.59 vs 0.72, p=0.022), about as significant as the gap between the two local runs on another Case (p=0.016), and its Claims were the same kinds in the same cells. A real 63-Case gate run is the proper check. What we found on the way, 2026-11-04: (1) Runtime works: a throwaway ARM64 container reached READY in about 20 s and called Nova Pro from inside it; creating runtimes, ECR repos, and IAM roles is allowed; deleting a runtime takes about 5 minutes. (2) A Gateway can't hold the LGND sign-in on an IAM-authorized gateway: CreateGatewayTarget fails with \"3LO Auth is not supported when gateway authorizer type is AWS_IAM\", and AUTHENTICATE_ONLY is also SigV4, so a browser sign-in through a Gateway needs a CUSTOM_JWT gateway (for example a Cognito user pool). (3) AgentCore Identity can hold it without a Gateway: LGND's sign-in server (WorkOS AuthKit) accepted a dynamic client registration with Identity's callback URL; after one browser approval the token is stored under a shared team user id; a fresh process fetched it with no browser; and a runtime fetched it with its own role (0.13 s) and made a real search_chip_lat_lon call (Ivanpah, NAIP 2022-04-27). Not yet checked: token refresh over hours. LGND's free tier (150 calls a day, per docs/mcp.md, unconfirmed with LGND) is shared by everyone using the team identity."
context = "AgentCore can host the agentic Harness as a managed agent that holds the LGND OAuth sign-in. The route, by script first and then CDK: prove each piece (Runtime and Identity done), move the Harness into a Runtime behind one Run contract, then codify it in CDK. The captioning model stays Nova Pro. The browser sign-in is a one-time step per account, so CDK can create everything except that approval. The Run contract: the Batch sends the Chip reference and hash, the footprint, the prompt, the model id, the tool list, and the turn budget, never Reference Labels (ADR-0006); the runtime returns the Caption and every Step in full, and the Batch writes the Trace (ADR-0001)."
