[[source]]
id = "geo-mcp-shortlist"
name = "Clay's Geo-MCP shortlist, including LGND Geo"
group = "Geospatial MCP tools"
url = "https://docs.google.com/spreadsheets/d/1cMoPxhNTzNHuWEAK_PtAgFUqEMxQ1AyoZxMCzfdkYzQ/edit?usp=sharing"
license = "Per server; LGND Geo is commercial (whitelisted for the hackathon)"
status = "partial"
data = "Tools, not datasets. LGND Geo (https://geo.lgnd.ai/mcp) has 18 tools in four groups (search, discover, classify, check) over embeddings of global Sentinel-2 and contiguous-US NAIP (2020–2023)."
format = "Remote MCP over HTTP with a per-person OAuth sign-in."
access = "In Claude Code it loads from the repo's .mcp.json in a session started in the repo. The Harness has no MCP client yet. Servers that read OSM (openstreetmap-mcp-server, mcp-nominatim, Overture) are forbidden to the Harness, since OSM is an Answer Key (ADR-0006)."
sample_from = "the shape of LGND Geo's imagery check, as planned for verify-then-write (caption-plan.md §1.3)"
sample = '''
reasoning_imagery_check(
  question = "Is there a solar array in this image?",
  images   = [<LGND NAIP image ids for the Claim's grid cell>]
) -> [{ image: "...", answer: "yes" | "no" | "maybe", reason: "..." }]'''
used_in = [
  { path = ".mcp.json", symbol = "geo.lgnd.ai/mcp", what = "team Claude Code sessions: searching NAIP for look-alike negatives while building Cases" },
]
notes = "The team uses it by hand today; the code doesn't call it. Next: an MCP client in the Harness, then verify-then-write. A tool used to verify Claims must never be used to score them."
tasks = ["lgnd-client", "verify-then-write", "lookalike-negatives", "workflow-score"]

