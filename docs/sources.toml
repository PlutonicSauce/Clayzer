# The External Dependencies in docs/vision-hackathon.md, shown on the Data sources page of
# `clayzer ui`. One [[source]] per dependency, in the vision doc's order.
#
#   group      the vision doc's bullet the source sits under
#   status     used (Clayzer reads it today), partial (some of it, or only by the team, not the
#              code), planned (a task will use it), waiting (on Clay), or unused (deliberately not)
#   data       what kind of data it is
#   format     the file or API shape
#   sample     a real record, trimmed; `sample_from` says where it came from
#   images     `chip:<id>` for a Chip in the store, or an https URL of a figure in the dataset's
#              own repo (hotlinked, never committed: several licenses don't allow it)
#   used_in    where Clayzer uses it: a repo path and a symbol that must appear in that file
#              (tests/test_ui.py checks both, so a rename shows up here)
#   tasks      ids from docs/tasks.toml that use or will use it
#
# Licenses and access notes follow caption-plan.md §3; keep the two in step.

# ── Input imagery ───────────────────────────────────────────────────────────────────────

[[source]]
id = "naip"
name = "NAIP (National Agriculture Imagery Program)"
group = "Input imagery"
url = "https://registry.opendata.aws/naip/"
license = "Public domain (USDA FSA)"
status = "used"
data = "Aerial imagery of the contiguous US: RGB + near-infrared, 0.6 m per pixel, 2010–2023, a new state-wide capture every 2–3 years."
format = "Cloud-optimized GeoTIFF per quarter-quad, found through a STAC catalog. Clayzer cuts 512 × 512 px RGB PNG Chips (about 300 m across) and stores a JSON sidecar."
access = "Two copies of the same imagery (CLAYZER_NAIP_SOURCE): `pc` = Microsoft Planetary Computer (free, SAS-signed), used while preparing Cases; `aws` = the `naip-visualization` bucket in us-west-2 (Requester-Pays), used in the sandbox. The Planetary Computer catalog finds the item either way."
sample_from = "data/chips/ca-uspvdb-400117-20220702.json (the Chip sidecar Clayzer writes)"
sample = '''
{
  "id": "ca-uspvdb-400117-20220702",
  "date": "2022-07-02",
  "bbox": [-118.195108, 35.228099, -118.191692, 35.230901],
  "crs": "EPSG:26911",
  "source": "naip-pc",
  "naip_item": "ca_m_3511855_nw_11_060_20220702",
  "size": 512,
  "res": 0.6
}'''
images = [
  { src = "chip:ca-uspvdb-400117-20220702", caption = "Solar Case: Pine Tree Solar, Kern County, NAIP 2022-07-02" },
  { src = "chip:ca-uswtdb-3025453-20220702", caption = "Wind Case: Alite Wind Farm turbines, NAIP 2022-07-02" },
  { src = "chip:ca-neg-1-20220607", caption = "Negative Case near Shafter, NAIP 2022-06-07" },
]
used_in = [
  { path = "src/clayzer/chips.py", symbol = "def find_naip", what = "STAC search for the latest NAIP item over a point, after the site's install year" },
  { path = "src/clayzer/chips.py", symbol = "def cut_chip", what = "windowed read and PNG + JSON write; picks Planetary Computer or the AWS bucket" },
  { path = "src/clayzer/cases.py", symbol = "find_naip", what = "every Case's Chip" },
  { path = "src/clayzer/harness.py", symbol = "NAIP", what = "the only input the captioner sees" },
  { path = "src/clayzer/judge.py", symbol = "NAIP", what = "the fidelity Judge looks at the same Chip" },
]
tasks = ["data-access", "dev-cases", "s3-store"]

