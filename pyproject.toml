[project]
name = "clayzer"
version = "0.1.0"
description = "Caption generation and evaluation for Clay v2: Chips, Cases, Captions, and scores."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10",
    "planetary-computer>=1.0",
    "pystac-client>=0.8",
    "python-dotenv>=1.0",
    "rasterio>=1.4",
    "shapely>=2.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "markdown>=3.5",
    "uvicorn>=0.30",
]
tools = [
    "mcp>=2.3,<3",
]

[project.scripts]
clayzer = "clayzer.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]
infra = [
    "aws-cdk-lib>=2.200",
    "constructs>=10",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clayzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
