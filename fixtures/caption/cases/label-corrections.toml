# Hand corrections to Reference Labels, applied whenever a Case is built (src/clayzer/cases.py).
#
# The Answer Keys are USGS and OSM, and OSM is incomplete: houses nobody mapped, dry washes
# mapped as water. Where a Chip clearly contradicts its labels, a person records the fix here
# so it survives a rebuild. Decided 2026-11-04 (caption-plan.md §10).
#
#   case    the Case id
#   object  an ontology class
#   action  "add": the object is in the image but not in the labels. Its cells are merged into
#           any existing label for the object, whose count becomes unknown (None).
#           "drop": the label names something the image doesn't show.
#   cells   for "add": every cell the object covers; the first is where most of it is
#   reason  what the image shows, for the next person checking

[[correction]]
case = "fixed-dev-neg-1"
object = "water"
action = "drop"
reason = "A dry retention basin; no water in the image."

[[correction]]
case = "fixed-dev-neg-2"
